window.ROBX_SERVER_URL = window.ROBX_SERVER_URL || "";
(function(){
 var URLW=window.ROBX_SERVER_URL||(location.protocol.indexOf("http")==0?location.origin.replace(/^http/,"ws"):"");
 var ws=null,openP=null,seq=0,pend={},snaps={},room=null,token=null,me=null,closing=false;

  else if(m.ev=="peers"&&room&&room.pc)room.pc({peers:m.peers});

  var s=new WebSocket(URLW);s.onopen=function(){ws=s;res()};s.onerror=function(){};s.onmessage=onMsg;
  s.onclose=function(){var was=ws===s;ws=null;openP=null;for(var k in pend){clearTimeout(pend[k].t);pend[k].rej(new Error("การเชื่อมต่อขาด"));delete pend[k]}if(!was)rej(new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"));if(token&&!closing)setTimeout(reconnect,1500)}});return openP}

 N.auth=function(op,name,pw,gender){return call({op:op,name:name,pw:pw,gender:gender}).then(function(r){token=r.token;N.uid=r.uid;N.admin=r.admin;try{localStorage.setItem("robx_tk",token)}catch(e){}return r})};
